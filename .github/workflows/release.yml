name: release

# Al pushear un tag vX.Y.Z arma el instalador de Windows y lo publica como Release de este mismo repo.
# También se puede lanzar a mano (Actions > release > Run workflow) indicando un tag existente:
# sirve para reintentar un release que falló. No necesita secrets: usa el GITHUB_TOKEN.
#
# Si el Release del tag ya existe (por ejemplo, creado desde la web), sube los archivos
# sobre ese mismo Release en lugar de fallar.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente a publicar (vX.Y.Z)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Versión desde el tag
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag inválido: $env:TAG (esperado vX.Y.Z)" }
          $version = $env:TAG.TrimStart("v")
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Tests
        shell: pwsh
        run: ./mvnw.cmd -B test "-Drevision=$env:VERSION"

      - name: Armar instalador
        shell: pwsh
        run: ./packaging/build-installer.ps1 -Version $env:VERSION -SkipTests

      - uses: actions/upload-artifact@v4
        with:
          name: CentauroPrinter-${{ env.VERSION }}
          path: build/installer/out/*

      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Continue"
          $out = "build/installer/out"
          $files = @(
            "$out/CentauroPrinter-Setup.exe",
            "$out/CentauroPrinter-Setup.exe.sha256",
            "$out/latest.json"
          )
          $title = "Centauro Printer $env:VERSION"
          $notes = "Instalador de Windows (sin firma de código todavía). SHA-256 en CentauroPrinter-Setup.exe.sha256."

          gh release view $env:TAG --repo $env:REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "El Release $env:TAG ya existe: se suben los archivos sobre ese Release."
            gh release upload $env:TAG @files --clobber --repo $env:REPO
            if ($LASTEXITCODE -ne 0) { throw "gh release upload falló" }
            gh release edit $env:TAG --title $title --notes $notes --draft=false --latest --repo $env:REPO
            if ($LASTEXITCODE -ne 0) { throw "gh release edit falló" }
          } else {
            gh release create $env:TAG @files --title $title --notes $notes --latest --repo $env:REPO
            if ($LASTEXITCODE -ne 0) { throw "gh release create falló" }
          }
