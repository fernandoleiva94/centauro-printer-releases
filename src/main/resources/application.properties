spring.application.name=printer
server.port=9710
# Permite al front (Netlify) pegarle al agente local:
allowed.origin=${ALLOWED_ORIGIN:*}

# Seguridad opcional (si no setea PRINT_TOKEN, no pide token)
print.security.token=${PRINT_TOKEN:}
logging.level.root=INFO
external.config.file=${EXTERNAL_CONFIG_FILE:C:/dist/centauro-pos-config/centauro-pos-config.properties}
print.default.printer=${PRINT_DEFAULT_PRINTER:}
scale.config.file=${SCALE_CONFIG_FILE:C:/dist/centauro-pos-config/scale-configs.json}

