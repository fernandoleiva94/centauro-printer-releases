spring.application.name=printer
server.port=${PRINTER_PORT:9710}
# El agente solo atiende al propio equipo: no se expone en la LAN.
server.address=127.0.0.1

# Directorio de datos del agente (config, balanzas, logs).
agent.home=${CENTAURO_PRINTER_HOME:${LOCALAPPDATA:${user.home}/.centauro-printer}/CentauroPrinter}

# Orígenes que pueden pegarle al agente (separados por coma, admiten https://*.dominio.com).
# ALLOWED_ORIGIN (singular) se mantiene por compatibilidad con instalaciones anteriores.
allowed.origins=${ALLOWED_ORIGINS:${ALLOWED_ORIGIN:http://localhost:*,http://127.0.0.1:*,https://centauropos.com,https://*.centauropos.com,https://centauropos.com.ar,https://*.centauropos.com.ar,https://*.netlify.app}}

# Seguridad opcional (si no setea PRINT_TOKEN, no pide token)
print.security.token=${PRINT_TOKEN:}
logging.level.root=INFO
# Vacío = <agent.home>/centauro-pos-config.properties y <agent.home>/scale-configs.json
external.config.file=${EXTERNAL_CONFIG_FILE:}
print.default.printer=${PRINT_DEFAULT_PRINTER:}
scale.config.file=${SCALE_CONFIG_FILE:}

management.endpoints.web.exposure.include=health
